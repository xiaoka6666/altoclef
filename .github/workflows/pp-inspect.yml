name: Preprocessor inspect

# One-off diagnostic: shows how the ReplayMod preprocessor reads version mapping files (format of method lines).
on:
  push:
    branches: [ccr-9292ccac-gfi0nr]
    paths: ['.github/workflows/pp-inspect.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Resolve plugin
        run: ./gradlew :1.16.1:help --console=plain 2>&1 | tail -5
      - name: Inspect
        run: |
          JAR=$(find ~/.gradle -name 'preprocessor*.jar' -size +50k | head -1)
          echo "jar: $JAR"
          unzip -l "$JAR" | awk '{print $4}' | grep -i -E 'mapping|remap' | head -60
          mkdir -p x && cd x && unzip -q -o "$JAR"
          K=com/replaymod/gradle/preprocess
          javap -p -c -constants "$K/PreprocessPluginKt.class" | awk '/getIntermediaryMappings\(|getNotchMappings\(|getMappingsProvider\(/{p=1} /^  (public|private|static)/{ if(!($0 ~ /getIntermediaryMappings\(|getNotchMappings\(|getMappingsProvider\(/)) p=0 } p' | sed -E 's/^ *//' | cut -c1-170
          echo "##### apply3"
          javap -p -c -constants "$K/PreprocessPlugin\$apply\$3.class" | sed -E 's/^ *//' | cut -c1-170 | sed -n '1,220p'
