name: Port check

# Diagnostic for the multi-version ports (1.21.11, 26.3). Compiles one preprocess node against the released
# Ostinato jar and keeps the full log, so port errors can be read without a local 15-minute build.
on:
  push:
    branches: [ccr-9292ccac-gfi0nr]
    paths: ['.github/workflows/port-check.yml']
  workflow_dispatch:
    inputs:
      node:
        description: 'Gradle node to compile (e.g. 1.21.11)'
        required: true
        default: '1.21.11'
      ostinato_asset:
        description: 'Ostinato v1.0.1 release asset to stage as libs/baritone-unoptimized-fabric-ostinato-<node>.jar'
        required: true
        default: 'ostinato-mc1.21.11-unoptimized-fabric-1.17.0.jar'
      java:
        description: 'JDK to build with'
        required: true
        default: '21'

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java || '21' }}
      - name: Stage Ostinato jar
        run: |
          curl -fsSL -o "libs/baritone-unoptimized-fabric-ostinato-${{ inputs.node || '1.21.11' }}.jar" \
            "https://github.com/vexrypt-rgb/Ostinato/releases/download/v1.0.1/${{ inputs.ostinato_asset || 'ostinato-mc1.21.11-unoptimized-fabric-1.17.0.jar' }}"
          ls -la libs
      - name: Compile ${{ inputs.node || '1.21.11' }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/maxerrs.gradle" <<'EOF'
          allprojects { tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-Xmaxerrs', '100000'] } }
          EOF
          ./gradlew -I "$RUNNER_TEMP/maxerrs.gradle" :${{ inputs.node || '1.21.11' }}:compileJava --console=plain --stacktrace 2>&1 | tee port-check.log
      - name: Error summary
        if: always()
        run: |
          echo "total errors: $(grep -c ' error: ' port-check.log || true)"
          echo "=== by message ==="
          grep -h ' error: ' port-check.log | sed 's/.* error: //' | sort | uniq -c | sort -rn | head -60
          echo "=== missing symbols ==="
          grep -h '^ *symbol: ' port-check.log | sed 's/^ *//' | sort | uniq -c | sort -rn | head -80
          echo "=== files with errors ==="
          grep -h ' error: ' port-check.log | sed 's/:[0-9]*: error:.*//; s#.*/preprocessed/main/java/##' | sort | uniq -c | sort -rn | head -80
      - name: API dump (remapped Minecraft classes)
        if: always()
        run: |
          JAR=""
          for j in $(find ~/.gradle/caches/fabric-loom -name '*.jar' 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/entity/Entity.class'; then JAR="$j"; break; fi
          done
          echo "minecraft jar: $JAR"
          [ -z "$JAR" ] && { find ~/.gradle/caches/fabric-loom -name '*.jar' | head -20; exit 0; }
          for c in net.minecraft.entity.Entity net.minecraft.entity.LivingEntity net.minecraft.entity.player.PlayerInventory \
                   net.minecraft.entity.player.PlayerEntity net.minecraft.world.dimension.DimensionType net.minecraft.client.gui.DrawContext \
                   net.minecraft.client.render.RenderLayer net.minecraft.item.ArmorItem net.minecraft.item.Item; do
            echo "##### $c"; javap -cp "$JAR" -public "$c" 2>&1 | head -400
          done > api-dump.txt
          wc -l api-dump.txt
          grep -n -E 'getEntityPos|getPos\(|getEntityWorld|getWorld\(|getMainStacks|getSelectedSlot|setSelectedSlot|EquippedItems|getEquippedStack|ultrawarm|drawHorizontalLine|fill\(|getGui|Matrix' api-dump.txt | head -60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: port-check-log-${{ inputs.node || '1.21.11' }}
          path: |
            port-check.log
            api-dump.txt
